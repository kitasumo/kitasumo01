<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>北のスモーク｜仮サイト</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: -apple-system, BlinkMacSystemFont,

    "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;

  color: #44372f;

  background: #fffaf2;

  line-height: 1.8;

}

img {

  max-width: 100%;

  display: block;

}

/* =====================

   ヘッダー

===================== */

.hero {

  width: 100%;

  background: #fff;

  overflow: hidden;

}

.hero img {

  width: 100%;

  height: auto;

  display: block;

}

/* =====================

   共通

===================== */

section {

  padding: 48px 20px;

}

.inner {

  max-width: 1000px;

  margin: 0 auto;

}

h2 {

  text-align: center;

  color: #5a3928;

  font-size: 25px;

  margin: 0 0 28px;

}

h2::after {

  content: "";

  display: block;

  width: 45px;

  height: 3px;

  background: #d7823d;

  margin: 10px auto 0;

  border-radius: 3px;

}

/* =====================

   北のスモークについて

===================== */

.about {

  background: #fff;

}

.about-layout {

  display: flex;

  gap: 40px;

  align-items: flex-start;

}

.about-text {

  flex: 1;

  font-size: 16px;

}

.side-links {

  width: 220px;

  text-align: right;

  font-size: 14px;

  color: #7a6658;

}

.side-links p {

  margin: 0 0 8px;

}

/* =====================

   商品ラインナップ

===================== */

.products {

  background: #fff8ee;

}

.product-list {

  display: flex;

  gap: 18px;

}

.product-card {

  flex: 1;

  background: #fff;

  padding: 14px;

  border-radius: 12px;

  box-shadow: 0 3px 12px rgba(0,0,0,.08);

  text-align: center;

}

.photo-space {

  height: 190px;

  background: #f1ece4;

  border: 2px dashed #d5c8b8;

  border-radius: 9px;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #a79b8e;

  font-size: 14px;

  overflow: hidden;

}

.product-card h3 {

  color: #5a3928;

  margin: 13px 0 4px;

  font-size: 18px;

}

.product-card p {

  margin: 0;

  color: #666;

  font-size: 14px;

}

/* =====================

   BLOG

===================== */

.blog {

  background: #fff;

  text-align: center;

}

.blog p {

  margin: 0 0 18px;

}

.blog-button {

  display: inline-block;

  background: #f58220;

  color: #fff;

  text-decoration: none;

  font-weight: bold;

  padding: 13px 35px;

  border-radius: 30px;

}

.blog-button:hover {

  opacity: 0.9;

}

/* =====================

   アクセス

===================== */

.access {

  background: #fff8ee;

}

.address {

  text-align: center;

  margin-bottom: 22px;

  font-size: 15px;

  line-height: 1.9;

}

.address div {

  margin: 0;

}

.tel {

  white-space: nowrap;

  margin-top: 4px !important;

}

.map-wrap {

  width: 100%;

  max-width: 650px;

  margin: 0 auto;

  overflow: hidden;

  border-radius: 12px;

  box-shadow: 0 3px 14px rgba(0,0,0,.10);

}

.map-wrap iframe {

  width: 100%;

  height: 280px;

  border: 0;

  display: block;

}

/* =====================

   フッター

===================== */

footer {

  background: #5a3928;

  color: #fff;

  text-align: center;

  padding: 24px 15px;

  font-size: 13px;

}

footer p {

  margin: 0;

}

/* =====================

   スマホ

===================== */

@media (max-width: 650px) {

  section {

    padding: 38px 14px;

  }

  h2 {

    font-size: 21px;

  }

  .about-layout {

    display: block;

  }

  .about-text {

    font-size: 14px;

  }

  .side-links {

    width: 100%;

    text-align: left;

    margin-top: 20px;

    font-size: 13px;

  }

  .product-list {

    gap: 7px;

  }

  .product-card {

    padding: 7px;

  }

  .photo-space {

    height: 105px;

    font-size: 11px;

  }

  .product-card h3 {

    font-size: 13px;

    line-height: 1.4;

  }

  .product-card p {

    font-size: 11px;

    line-height: 1.5;

  }

  .address {

    font-size: 13px;

    line-height: 1.8;

  }

  .map-wrap {

    max-width: 520px;

  }

  .map-wrap iframe {

    height: 220px;

  }

}

</style>

</head>
